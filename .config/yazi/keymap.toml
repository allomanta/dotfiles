# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
#:schema "https://yazi-rs.github.io/schemas/keymap.json"


[mgr]
prepend_keymap = [
  # Navigation
  { on = "<C-PageUp>",   run = "arrow -50%", desc = "Move cursor up half page" },
  { on = "<C-PageDown>", run = "arrow 50%",  desc = "Move cursor down half page" },
  { on = "<S-PageUp>",   run = "seek -5",    desc = "Seek up 5 units in the preview" },
  { on = "<S-PageDown>", run = "seek 5",     desc = "Seek down 5 units in the preview" },
  { on = [ "g", "e" ],   run = "arrow bot",  desc = "Move cursor to the bottom" },

  # Directories
  { on = [ "g", "t" ], run = "cd /tmp",                          desc = "Go to the temporary directory" },
  { on = [ "g", "T" ], run = "plugin trash",                     desc = "Go to trash bin" },
  { on = [ "g", "P" ], run = "cd ~/Pictures",                    desc = "Go to the pictures directory" },
  { on = [ "g", "p" ], run = "cd ~/Projects",                    desc = "Go to the projects directory" },
  { on = [ "g", "b" ], run = "cd ~/Programming/blosh",           desc = "Go to the blosh directory" },
  { on = [ "g", "C" ], run = "cd ~/Programming/blosh/Main/code", desc = "Go to the blosh code directory" },
  { on = [ "g", "D" ], run = "cd ~/Documents",                   desc = "Go to the documents directory" },
  { on = [ "g", "r" ], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Go to git root" },

  # Plugins
  { on = [ "g", "l" ], run = "plugin lazygit",            desc = "Run lazygit" },
  { on = [ "g", "G" ], run = "plugin vcs-files",          desc = "Show git file changes" },
  { on = [ "c", "i" ], run = "plugin copy-file-contents", desc = "Copy the contents of the file" },
  { on = "u",          run = "plugin restore",            desc = "Restore last deleted files/folders" },
  { on = "<A-p>",      run = "plugin max-preview",        desc = "Maximize or restore preview" },
  { on = "M",          run = "plugin mount",              desc = "Show the mount manager" },
  { on = "z",          run = "plugin zoxide",             desc = "Jump to a directory via zoxide" },
  { on = "Z",          run = "plugin fzf2",               desc = "Jump to a file/directory via fzf" },

  # Operations
  { on = "%",     run = "toggle_all --state=on",                desc = "Select all files" },
  { on = "o",     run = "open --interactive",                   desc = "Open the selected files interactively" },
  { on = "A",     run = "create --dir",                         desc = "Create a directory" },
  { on = "t",     run = "tab_create --current",                 desc = "Create a new tab using the current path" },
  { on = "!",     run = 'shell "$SHELL" --block',               desc = "Open shell here" },
  { on = "<A-d>", run = "shell -- dragon-drop -x -T -a %s",     desc = "Open drag and drop window" },

  # Sorting (directories first)
  { on = [ ",", "m" ], run = "sort mtime --reverse=no --dir-first",        desc = "Sort by modified time" },
  { on = [ ",", "M" ], run = "sort mtime --reverse=yes --dir-first",       desc = "Sort by modified time (reverse)" },
  { on = [ ",", "c" ], run = "sort btime --reverse=no --dir-first",        desc = "Sort by created time" },
  { on = [ ",", "C" ], run = "sort btime --reverse=yes --dir-first",       desc = "Sort by created time (reverse)" },
  { on = [ ",", "e" ], run = "sort extension --reverse=no --dir-first",    desc = "Sort by extension" },
  { on = [ ",", "E" ], run = "sort extension --reverse=yes --dir-first",   desc = "Sort by extension (reverse)" },
  { on = [ ",", "a" ], run = "sort alphabetical --reverse=no --dir-first", desc = "Sort alphabetically" },
  { on = [ ",", "A" ], run = "sort alphabetical --reverse=yes --dir-first", desc = "Sort alphabetically (reverse)" },
  { on = [ ",", "n" ], run = "sort natural --reverse=no --dir-first",      desc = "Sort naturally" },
  { on = [ ",", "N" ], run = "sort natural --reverse=yes --dir-first",     desc = "Sort naturally (reverse)" },
  { on = [ ",", "s" ], run = "sort size --reverse=no --dir-first",         desc = "Sort by size" },
  { on = [ ",", "S" ], run = "sort size --reverse=yes --dir-first",        desc = "Sort by size (reverse)" },
]

[help]
prepend_keymap = [
  { on = "q", run = "close",  desc = "Exit the help menu" },
  { on = "/", run = "filter", desc = "Apply a filter for the help items" },
]
